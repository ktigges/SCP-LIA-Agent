# LIA MCP plugin.
# Update Endpoint and tool names to match the deployed collection.
# Keep AllowedTools in sync with the agent manifest.

Descriptor:
  Name: LIASentinelMCP
  DisplayName: LIA Sentinel MCP Tools
  Description: >-
    Approved, read-only, parameterized KQL tools for the LIA investigation agent.
  DescriptionForModel: >-
    Read-only investigation tools for one device, one user, or one SHA256 over a bounded UTC
    interval. normalize_time_window converts the analyst's local start and end
    times to UTC and validates the interval; call it before any other tool.
    resolve_device and resolve_user map an exact identifier to a
    canonical identity. get_device_timeline returns Defender endpoint events for
    one DeviceId. get_user_authentication_timeline returns sign-in and logon events
    for one user. get_file_hash_activity finds where an exact SHA256 was observed
    across all visible devices over a window of at most 30 days.
    get_related_alerts returns Defender and Sentinel alerts whose
    evidence references the entity. match_observed_indicators checks observed IPs,
    domains, URLs and SHA256 hashes against threat intelligence. get_source_coverage
    reports which expected tables exist and how many matching records each holds.
    All tools require StartTimeUtc and EndTimeUtc as ISO 8601 UTC strings.

SkillGroups:
  - Format: MCP
    Settings:
      Endpoint: https://sentinel.microsoft.com/mcp/custom/LIA
      TokenScope: 4500ebfb-89b6-4b14-a480-7f749797bfcd/.default
      UseStreamableHttp: true
      UsePluginAuth: false
      # Tool names must match the deployed collection.
      AllowedTools: normalize_time_window,resolve_device,resolve_user,get_device_timeline,get_user_authentication_timeline,get_file_hash_activity,get_related_alerts,match_observed_indicators,get_source_coverage
      TimeoutInSeconds: 300
